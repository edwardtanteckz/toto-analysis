name: Daily TOTO/4D job

on:
  schedule:
    - cron: "30 1 * * *"          # 01:30 UTC = 09:30 Singapore (GitHub may start it some minutes late)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: daily
        options:
          - daily              # full job: update DB, picks, report, TOTO alert if due
          - test-notification  # just send a test message to Telegram/Slack
          - dry-run-alert      # update + show the alert without sending it

permissions:
  contents: write                 # commit the updated DB + report back to the repo

concurrency:
  group: daily-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Singapore          # date logic (alert day, next 4D draw) uses Singapore time
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test notification
        if: inputs.mode == 'test-notification'
        run: python -m sgpools.notify --test

      - name: Update DB and show alert (no send)
        if: inputs.mode == 'dry-run-alert'
        run: |
          python update_db.py
          python toto_alert.py --dry-run

      - name: Daily job
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        run: python run_daily.py

      - name: Save DB and report to the repo
        if: always() && inputs.mode != 'test-notification'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sgpools.db reports/eda.html
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Daily data update $(date +%F) [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Upload report
        if: always() && inputs.mode != 'test-notification'
        uses: actions/upload-artifact@v4
        with:
          name: eda-report
          path: reports/eda.html
          retention-days: 30
          if-no-files-found: ignore
