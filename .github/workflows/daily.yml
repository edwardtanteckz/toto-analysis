name: Daily TOTO/4D job

on:
  schedule:
    # GitHub often delays or drops runs at busy times (top/half of the hour), so use off-peak minutes
    # plus a backup run. The job is idempotent and the alert is recorded once sent, so a second run
    # never sends a duplicate.
    - cron: "23 1 * * *"          # 09:23 Singapore (main run)
    - cron: "47 2 * * *"          # 10:47 Singapore (backup if the main run was skipped/late)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: daily
        options:
          - daily              # full job: update DB, picks, report, TOTO alert if due
          - test-notification  # just send a test message to Telegram/Slack
          - test-alert         # send the real TOTO alert now (not recorded as sent)
          - dry-run-alert      # update + show the alert without sending it

concurrency:
  group: daily-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write             # commit the updated DB + report back to the repo
    outputs:
      publish: ${{ steps.site.outcome == 'success' }}
    env:
      TZ: Asia/Singapore          # date logic (alert day, next 4D draw) uses Singapore time
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test notification
        if: inputs.mode == 'test-notification'
        run: python -m sgpools.notify --test

      - name: Send the real TOTO alert now (test)
        if: inputs.mode == 'test-alert'
        run: python toto_alert.py --force

      - name: Update DB and show alert (no send)
        if: inputs.mode == 'dry-run-alert'
        run: |
          python update_db.py
          python toto_alert.py --dry-run

      - name: Daily job
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        run: python run_daily.py

      - name: Save DB and report to the repo
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'daily' || inputs.mode == 'dry-run-alert')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sgpools.db reports/eda.html
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Daily data update $(date +%F) [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Prepare Pages site
        id: site
        if: always() && hashFiles('reports/eda.html') != '' && (github.event_name == 'schedule' || inputs.mode == 'daily' || inputs.mode == 'dry-run-alert')
        run: |
          mkdir -p _site
          cp reports/eda.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: always() && steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job (GitHub's recommended pattern): only runs that built the report create a Pages
  # deployment, and the artifact is fully registered before the deploy step looks for it.
  deploy:
    needs: run
    if: always() && needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
